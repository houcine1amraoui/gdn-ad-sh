seed: 42

dataset:
  # path: data/sample/BREMaster-3.csv
  raw_data_path: data/raw/CUMaster.csv
  processed_data_folder: data/processed
  window_size: 30

models:
  - name: "gdn"
    enabled: true
    params:
      hidden_dim: 64
      topk: 10 # previously 15
      heads: 1

  - name: "mtad_gat"
    enabled: true
    params:
      kernel_size: 7
      gru_hidden_dim: 150
      gat_heads: 3

training:
  model: mtad_gat
  batch_size: 64
  epochs: 50
  lr: 0.001
  patience: 20
  train_experiments_main_folder: train_experiments

evaluation:
  model: mtad_gat
  batch_size: 64
  threshold_percentile: 99
  eval_results_folder: eval_results
